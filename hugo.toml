baseURL = "/"
languageCode = "en-us"
contentDir = "content"
enableEmoji = true
enableGitInfo = false
defaultContentLanguage = "en"
title = "Mine Programming Language"

[languages]
  [languages.en]
    title = "Mine Programming Language"
    languageName = "English"
    weight = 10

[module]
  replacements = "github.com/maysara-elshewehy/minedocs-theme -> minedocs-theme"
  [[module.imports]]
    path = "github.com/maysara-elshewehy/minedocs-theme"
    disable = false
  [[module.imports]]
    path = "github.com/gohugoio/hugo-mod-bootstrap-scss/v5"
    disable = false

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  google_fonts = [
    ["Inter", "300, 400, 600, 700"],
    ["Fira Code", "500, 700"]
  ]

  sans_serif_font = "Inter"
  secondary_font  = "Inter"
  mono_font       = "Fira Code"

  [params.footer]
    copyright = ""

  [params.social]
    github = "minelang"
    twitter = "minelanguage"

  [params.docs]
    title           = "Mine Programming Language Documentation"
    darkMode        = true
    themeColor      = "black"
    prism           = true
    prismTheme      = "vsc-dark-plus"
    repoURL         = "https://github.com/minelang"
    repoBranch      = "main"
    editPage        = true
    lastMod         = true
    lastModRelative = true
    sidebarIcons    = true
    breadcrumbs     = true
    backToTop       = true
    toc             = true
    tocMobile       = true
    scrollSpy       = true

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Documentation"
  url = "/docs/"
  weight = 20

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 25

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/minelang"
  weight = 30

[[menu.main]]
  name = "Community"
  url = "https://discord.com/#"
  weight = 40

[build]
  [build.cachebusters]
    [build.cachebusters.assets.dir]
      command = "hugo mod get -u"
      pattern = "^assets/.*\\.(js|ts|jsx|tsx)($|\\?)"
    [build.cachebusters.content]
      command = "hugo mod tidy"
      pattern = "^content/(.*)$"

[security]
  enableInlineShortcodes = false
